<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-Tekken 3D 1v1 Fighting Demo</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body { margin: 0; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  
  /* UI Layout */
  #ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px 30px;
    z-index: 10;
  }

  /* HUD Header */
  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
  }

  .player-card {
    display: flex;
    flex-direction: column;
    width: 42%;
  }

  .player-card.p2 {
    align-items: flex-end;
  }

  .player-name {
    font-size: 1.2rem;
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  .p1 .player-name { color: #00d2ff; }
  .p2 .player-name { color: #ff3366; }

  .hp-bar-bg {
    width: 100%;
    height: 24px;
    background: rgba(20, 20, 35, 0.85);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
  }

  .hp-bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.15s ease-out;
  }

  .p1 .hp-bar-fill {
    background: linear-gradient(90deg, #0055ff, #00d2ff);
    box-shadow: 0 0 12px #00d2ff;
  }

  .p2 .hp-bar-fill {
    background: linear-gradient(90deg, #ff0055, #ff5533);
    float: right;
    box-shadow: 0 0 12px #ff3366;
  }

  .vs-badge {
    font-size: 2.2rem;
    font-weight: 900;
    font-style: italic;
    color: #ffd700;
    text-shadow: 0 0 15px #ffaa00, 0 0 30px #ff5500;
    margin-top: 4px;
  }

  /* Combo / Hit Notification */
  .combo-text {
    position: absolute;
    font-size: 1.5rem;
    font-weight: 900;
    font-style: italic;
    color: #ffea00;
    text-shadow: 0 0 10px #ffaa00;
    opacity: 0;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    transform: scale(0.5);
  }
  .combo-text.active {
    opacity: 1;
    transform: scale(1.3);
  }

  /* Controls Footer */
  .controls-panel {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background: rgba(10, 10, 20, 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 10px 20px;
    color: #aaa;
    font-size: 0.85rem;
  }
  .key-badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
    border: 1px solid rgba(255,255,255,0.3);
    margin: 0 2px;
  }

  /* KO Screen Overlay */
  #ko-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 5, 12, 0.85);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #ko-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .ko-title {
    font-size: 5rem;
    font-weight: 900;
    font-style: italic;
    color: #ff0044;
    text-shadow: 0 0 20px #ff0044, 0 0 40px #ff8800;
    animation: pulse 1s infinite alternate;
    margin: 0;
  }
  .winner-text {
    font-size: 2rem;
    color: #fff;
    margin: 15px 0 30px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  .restart-btn {
    background: linear-gradient(135deg, #00d2ff, #0055ff);
    color: #fff;
    font-size: 1.2rem;
    font-weight: bold;
    padding: 14px 40px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
    transition: transform 0.2s, box-shadow 0.2s;
    pointer-events: auto;
  }
  .restart-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.9);
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }
</style>
</head>
<body>

<div id="ui">
  <div class="hud-top">
    <div class="player-card p1">
      <div class="player-name">Player 1 (Cyber Blue)</div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp1"></div></div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="player-card p2">
      <div class="player-name">Player 2 (Neon Red)</div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp2"></div></div>
    </div>
  </div>

  <div id="combo-p1" class="combo-text" style="top: 25%; left: 20%;">HIT!</div>
  <div id="combo-p2" class="combo-text" style="top: 25%; right: 20%;">HIT!</div>

  <div class="controls-panel">
    <div><strong>P1:</strong> <span class="key-badge">A</span><span class="key-badge">D</span> Move | <span class="key-badge">W</span> Jump | <span class="key-badge">S</span> Punch</div>
    <div><strong>P2:</strong> <span class="key-badge">←</span><span class="key-badge">→</span> Move | <span class="key-badge">↓</span> Jump | <span class="key-badge">↑</span> Punch</div>
  </div>
</div>

<div id="ko-overlay">
  <h1 class="ko-title">K. O.</h1>
  <div class="winner-text" id="winner-text">PLAYER 1 WINS!</div>
  <button class="restart-btn" id="restart-btn">REMATCH</button>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

// ----- Audio Synthesizer (Web Audio API) -----
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSynthSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  if (type === 'punch') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'hit') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.18);
  } else if (type === 'jump') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'ko') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.linearRampToValueAtTime(100, now + 0.8);
    gain.gain.setValueAtTime(0.6, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.8);
  }
}

// ----- Scene Setup -----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.FogExp2(0x0a0a14, 0.03);

// ----- Camera -----
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 4.5, 11);
let cameraShake = 0;

// ----- Renderer -----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ----- Lighting -----
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 15, 8);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const p1Light = new THREE.PointLight(0x00d2ff, 1.5, 8);
p1Light.position.set(-3, 2, 1);
scene.add(p1Light);

const p2Light = new THREE.PointLight(0xff0055, 1.5, 8);
p2Light.position.set(3, 2, 1);
scene.add(p2Light);

// ----- Arena Floor -----
const floorGeo = new THREE.PlaneGeometry(30, 30);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x121220,
  roughness: 0.3,
  metalness: 0.7
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Grid Helper for Cyber Arena aesthetic
const grid = new THREE.GridHelper(30, 30, 0x00d2ff, 0x222244);
grid.position.y = 0.01;
scene.add(grid);

// Outer Ring Light
const ringGeo = new THREE.RingGeometry(11.9, 12.1, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, side: THREE.DoubleSide });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.02;
scene.add(ring);

// ----- Particle Spark System -----
const sparkCount = 40;
const sparkGeo = new THREE.BufferGeometry();
const sparkPositions = new Float32Array(sparkCount * 3);
const sparkVelocities = [];

for (let i = 0; i < sparkCount; i++) {
  sparkPositions[i * 3] = 0;
  sparkPositions[i * 3 + 1] = -10; // hidden initially
  sparkPositions[i * 3 + 2] = 0;
  sparkVelocities.push(new THREE.Vector3());
}
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
const sparkMat = new THREE.PointsMaterial({
  color: 0xffea00,
  size: 0.25,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});
const sparkParticles = new THREE.Points(sparkGeo, sparkMat);
scene.add(sparkParticles);

function triggerSparks(pos) {
  const positions = sparkParticles.geometry.attributes.position.array;
  for (let i = 0; i < sparkCount; i++) {
    positions[i * 3] = pos.x;
    positions[i * 3 + 1] = pos.y + 1;
    positions[i * 3 + 2] = pos.z;
    sparkVelocities[i].set(
      (Math.random() - 0.5) * 0.3,
      Math.random() * 0.2 + 0.1,
      (Math.random() - 0.5) * 0.3
    );
  }
  sparkParticles.geometry.attributes.position.needsUpdate = true;
}

// ----- Fighter Character Generator -----
function createFighter(mainColor, xPos, facingDir) {
  const group = new THREE.Group();

  const mainMat = new THREE.MeshStandardMaterial({
    color: mainColor,
    roughness: 0.4,
    metalness: 0.6
  });

  const darkMat = new THREE.MeshStandardMaterial({
    color: 0x151522,
    roughness: 0.5
  });

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  // Torso
  const torsoGeo = new THREE.BoxGeometry(0.9, 1.1, 0.5);
  const torso = new THREE.Mesh(torsoGeo, mainMat);
  torso.position.y = 1.35;
  torso.castShadow = true;
  group.add(torso);

  // Head
  const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const head = new THREE.Mesh(headGeo, darkMat);
  head.position.y = 2.2;
  head.castShadow = true;
  group.add(head);

  // Visor / Eyes
  const visorGeo = new THREE.BoxGeometry(0.4, 0.12, 0.1);
  const visor = new THREE.Mesh(visorGeo, eyeMat);
  visor.position.set(0, 2.22, 0.23);
  group.add(visor);

  // Right Arm (Punching arm)
  const armGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
  const rArm = new THREE.Mesh(armGeo, mainMat);
  rArm.position.set(0.65, 1.4, 0);
  rArm.castShadow = true;
  group.add(rArm);

  // Left Arm
  const lArm = new THREE.Mesh(armGeo, mainMat);
  lArm.position.set(-0.65, 1.4, 0);
  lArm.castShadow = true;
  group.add(lArm);

  // Right Leg
  const legGeo = new THREE.BoxGeometry(0.35, 0.9, 0.35);
  const rLeg = new THREE.Mesh(legGeo, darkMat);
  rLeg.position.set(0.28, 0.45, 0);
  rLeg.castShadow = true;
  group.add(rLeg);

  // Left Leg
  const lLeg = new THREE.Mesh(legGeo, darkMat);
  lLeg.position.set(-0.28, 0.45, 0);
  lLeg.castShadow = true;
  group.add(lLeg);

  group.position.set(xPos, 0, 0);
  group.rotation.y = facingDir === 1 ? Math.PI / 2 : -Math.PI / 2;
  scene.add(group);

  return {
    mesh: group,
    torso, head, rArm, lArm, rLeg, lLeg, mainMat,
    color: mainColor
  };
}

const fighter1 = createFighter(0x00d2ff, -3, 1);
const fighter2 = createFighter(0xff0055, 3, -1);

// ----- Game State -----
const state = {
  p1: {
    fighter: fighter1,
    mesh: fighter1.mesh,
    vel: new THREE.Vector3(),
    hp: 100,
    dir: 1,
    punchTimer: 0,
    hitTimer: 0,
    baseX: -3
  },
  p2: {
    fighter: fighter2,
    mesh: fighter2.mesh,
    vel: new THREE.Vector3(),
    hp: 100,
    dir: -1,
    punchTimer: 0,
    hitTimer: 0,
    baseX: 3
  },
  keys: {},
  gameOver: false
};

// ----- Keyboard Event Listeners -----
window.addEventListener('keydown', e => {
  state.keys[e.code] = true;
});
window.addEventListener('keyup', e => {
  state.keys[e.code] = false;
});

// ----- Movement & Combat Logic -----
function updateFighter(p, leftKey, rightKey, jumpKey, punchKey) {
  if (state.gameOver) return;

  const speed = 0.12;
  const jumpVel = 0.28;

  // Horizontal Movement
  let isMoving = false;
  if (state.keys[leftKey]) {
    p.mesh.position.x -= speed;
    p.dir = -1;
    isMoving = true;
  }
  if (state.keys[rightKey]) {
    p.mesh.position.x += speed;
    p.dir = 1;
    isMoving = true;
  }

  // Facing opponent
  p.mesh.rotation.y = p.dir === 1 ? Math.PI / 2 : -Math.PI / 2;

  // Arena Boundaries
  p.mesh.position.x = Math.max(-10, Math.min(10, p.mesh.position.x));

  // Jump Logic
  if (state.keys[jumpKey] && p.mesh.position.y <= 0.01) {
    p.vel.y = jumpVel;
    playSynthSound('jump');
  }

  // Gravity
  p.vel.y -= 0.015;
  p.mesh.position.y += p.vel.y;
  if (p.mesh.position.y < 0) {
    p.mesh.position.y = 0;
    p.vel.y = 0;
  }

  // Punch Logic
  if (state.keys[punchKey] && p.punchTimer <= 0) {
    p.punchTimer = 15; // Punch animation frames
    playSynthSound('punch');
    tryPunch(p);
    state.keys[punchKey] = false; // Debounce key
  }

  // Punch Animation Lerp
  if (p.punchTimer > 0) {
    p.punchTimer--;
    // Extend right arm forward
    p.fighter.rArm.position.z = 0.6;
    p.fighter.rArm.position.y = 1.4;
    p.fighter.rArm.rotation.x = -Math.PI / 2;
  } else {
    p.fighter.rArm.position.z = 0;
    p.fighter.rArm.position.y = 1.4;
    p.fighter.rArm.rotation.x = 0;
  }

  // Hit reaction animation
  if (p.hitTimer > 0) {
    p.hitTimer--;
    p.fighter.mainMat.emissive.setHex(0xff0000);
    p.mesh.rotation.z = p.dir * -0.2;
  } else {
    p.fighter.mainMat.emissive.setHex(0x000000);
    p.mesh.rotation.z = 0;
  }

  // Simple leg stance stride animation
  if (isMoving && p.mesh.position.y <= 0.01) {
    const time = Date.now() * 0.015;
    p.fighter.rLeg.rotation.x = Math.sin(time) * 0.5;
    p.fighter.lLeg.rotation.x = -Math.sin(time) * 0.5;
  } else {
    p.fighter.rLeg.rotation.x = 0;
    p.fighter.lLeg.rotation.x = 0;
  }
}

function tryPunch(attacker) {
  const defender = attacker === state.p1 ? state.p2 : state.p1;
  const distance = attacker.mesh.position.distanceTo(defender.mesh.position);
  const facing = (defender.mesh.position.x - attacker.mesh.position.x) * attacker.dir > 0;

  if (distance < 2.2 && facing) {
    defender.hp = Math.max(0, defender.hp - 10);
    defender.hitTimer = 10;
    
    // Knockback
    defender.mesh.position.x += attacker.dir * 0.4;
    
    // FX & Audio
    playSynthSound('hit');
    triggerSparks(defender.mesh.position);
    cameraShake = 0.3;

    // Trigger UI combo alert
    showComboText(attacker === state.p1 ? 'p1' : 'p2');
    updateHPBars();

    // Check KO
    if (defender.hp <= 0 && !state.gameOver) {
      triggerKO(attacker === state.p1 ? 'PLAYER 1 (BLUE)' : 'PLAYER 2 (RED)');
    }
  }
}

// ----- UI Helpers -----
function updateHPBars() {
  document.getElementById('hp1').style.width = state.p1.hp + '%';
  document.getElementById('hp2').style.width = state.p2.hp + '%';
}

function showComboText(player) {
  const el = document.getElementById(`combo-${player}`);
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 300);
}

function triggerKO(winnerText) {
  state.gameOver = true;
  playSynthSound('ko');
  document.getElementById('winner-text').textContent = `${winnerText} WINS!`;
  document.getElementById('ko-overlay').classList.add('show');
}

function restartGame() {
  state.p1.hp = 100;
  state.p2.hp = 100;
  state.p1.mesh.position.set(-3, 0, 0);
  state.p2.mesh.position.set(3, 0, 0);
  state.p1.vel.set(0, 0, 0);
  state.p2.vel.set(0, 0, 0);
  state.p1.dir = 1;
  state.p2.dir = -1;
  state.gameOver = false;
  updateHPBars();
  document.getElementById('ko-overlay').classList.remove('show');
}

document.getElementById('restart-btn').addEventListener('click', restartGame);

// ----- Main Animation Loop -----
function animate() {
  requestAnimationFrame(animate);

  // Player 1 Movement (A/D/W/S)
  updateFighter(state.p1, 'KeyA', 'KeyD', 'KeyW', 'KeyS');

  // Player 2 Movement (Arrow Keys: Left/Right/Down=Jump/Up=Punch)
  updateFighter(state.p2, 'ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp');

  // Update Sparks
  const positions = sparkParticles.geometry.attributes.position.array;
  for (let i = 0; i < sparkCount; i++) {
    positions[i * 3] += sparkVelocities[i].x;
    positions[i * 3 + 1] += sparkVelocities[i].y;
    positions[i * 3 + 2] += sparkVelocities[i].z;
    sparkVelocities[i].y -= 0.01; // Gravity
  }
  sparkParticles.geometry.attributes.position.needsUpdate = true;

  // Dynamic Camera Tracking (Midpoint between fighters)
  const midX = (state.p1.mesh.position.x + state.p2.mesh.position.x) / 2;
  const dist = Math.abs(state.p1.mesh.position.x - state.p2.mesh.position.x);
  
  const targetCamX = midX;
  const targetCamZ = Math.max(9, dist * 0.85 + 4);

  camera.position.x += (targetCamX - camera.position.x) * 0.08;
  camera.position.z += (targetCamZ - camera.position.z) * 0.08;

  // Camera Shake Effect
  if (cameraShake > 0) {
    camera.position.x += (Math.random() - 0.5) * cameraShake;
    camera.position.y += (Math.random() - 0.5) * cameraShake;
    cameraShake *= 0.85;
    if (cameraShake < 0.01) cameraShake = 0;
  } else {
    camera.position.y = 4.5;
  }

  camera.lookAt(midX, 1.2, 0);

  // Point light tracking
  p1Light.position.x = state.p1.mesh.position.x;
  p1Light.position.y = state.p1.mesh.position.y + 1.5;
  p2Light.position.x = state.p2.mesh.position.x;
  p2Light.position.y = state.p2.mesh.position.y + 1.5;

  renderer.render(scene, camera);
}

animate();

// ----- Window Resize Handler -----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
